[project]
name = "i-so-8859-1-decoder"
version = "0.1.0"
description = "Decodes and encodes using the ISO 8859-1 (Latin-1) character set, a standard for Western European text."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
